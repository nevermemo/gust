# Unit-tier gate (docs/development/VALIDATION.md). Hosted runners have no GPU and no
# slangc, so Spirv and Gpu evidence stays local. The `slang` job installs the pinned Slang
# (cargo gust slang install) and earns the Slangc tier on CI; the Reflect tier needs an adapter
# and runs in gpu-software (lavapipe).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned here so a new stable release cannot change CI without a commit;
  # overrides the "stable" channel in rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit suite
        # macro and xtask tests, lint, docs-check, check-arch, check-ui, check-cpu, the gust::cpu and gust::artifact
        # tests. `--skip-difftest` leaves out the four steps of the differential test harness (fmt, clippy and tests of
        # tests/difftest, and the batch `check-difftest --cpu-only --seeds 1-4`): the job `difftest` below runs them
        # beside this one, because the batch builds the generated crate with `wgpu` and `gust-wgpu` (88 s cold on the
        # development PC) and this job keeps its time (R4.10). The suite prints each skipped step; a local run of
        # `cargo xtask test --suite Unit` runs them.
        run: cargo --locked xtask test --suite Unit --skip-difftest
      - name: Dual test build
        # `--cfg gust_dual` (D26): fmt and clippy of tests/dual, the workspace built with the cfg, and the cross-crate
        # proof E1-E3. Cargo only; the examples' GPU runs of the full mode stay local.
        run: cargo --locked xtask check-dual --check-only

  msrv:
    # Measures the declared minimum Rust version (Cargo.toml rust-version, D30): compiles every
    # workspace target, including tests and examples, with exactly that toolchain. No slangc
    # and no GPU are involved, so this is Unit-tier evidence only. Not a required check yet.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Job-level value wins over the workflow-level pin above.
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check on the minimum version
        run: cargo check --workspace --all-targets --locked

  cpu-target:
    # The production CPU target (D21, D51; slice m5.e2): `GUST_PROFILE=cpu` builds the fixture tests/cpu-target in
    # release and runs it on the CPU against host references, scans its binary, checks the refusals (`gust-wgpu` under
    # cpu, the bridge feature, the missing twin without the profile, an opted-out kernel) and the profile flips in one
    # target directory. A job of its own because its fixture builds from nothing on a runner (no cache; the other jobs
    # use none either), which would lengthen `unit` past its budget; it runs beside `unit`. Cargo only: no slangc and
    # no GPU. This is the Cpu evidence tier (`cargo xtask test --suite Cpu` runs the same command).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Production CPU target
        run: cargo --locked xtask check-cpu-target

  difftest:
    # The differential test harness (tests/difftest, slice m5.c2, plan M5 R1-13), CPU side: a separate workspace
    # that the root's fmt, clippy and test never reach, so its own format check, clippy (all targets, warnings denied)
    # and tests run here, then the batch `check-difftest --cpu-only --seeds 1-4` (64 generated programs, the
    # interpreter against the CPU twin; report.json judged by the xtask). A job of its own because the batch builds
    # the generated crate with `wgpu` from nothing (88 s cold on the development PC), which would lengthen `unit` past
    # its budget (R4.10); it runs beside `unit`, and `unit` and `slang` pass `--skip-difftest` (a test pins that these
    # four steps are the ones `cargo xtask test --suite Unit` skips). Cargo only: no slangc and no GPU, so this is the
    # Unit tier (an interpreter and a twin agreeing is never GPU evidence); the GPU side is in gpu-software.
    # One target directory for the job: the xtask, the harness's own build, the short_circuit test (it reads
    # CARGO_TARGET_DIR) and the run crate of the batch (`difftest-run --target-dir`, which the xtask points at the same
    # directory) build `wgpu` once there, and the cache below keeps it between runs. The round-trip test builds its
    # crates with its own CARGO_TARGET_DIR on purpose (a nested cargo must not share the directory of the cargo test
    # that runs it) and so keeps `<target>/tmp/difftest/target`, inside the same cached directory.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache cargo and the target directory
        # Same step as gpu-software; the key also covers the harness lockfiles (tests/difftest/Cargo.lock and the
        # template lock of the generated crates), which the root Cargo.lock does not.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: difftest-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'tests/difftest/**/Cargo.lock') }}
          restore-keys: |
            difftest-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Harness format
        run: cargo fmt --manifest-path tests/difftest/Cargo.toml -- --check
      - name: Harness clippy
        run: cargo clippy --locked --manifest-path tests/difftest/Cargo.toml --all-targets -- -D warnings
      - name: Harness tests
        run: cargo test --locked --manifest-path tests/difftest/Cargo.toml
      - name: Differential batch (CPU only)
        run: cargo --locked xtask check-difftest --cpu-only --seeds 1-4

  slang:
    # The pinned-Slang manager end to end (D46, R4.8, slice m4.f). `cargo gust slang install` downloads the pinned Slang
    # (version and archive hashes: crates/cargo-gust/src/slang.rs, the one place they live) from Slang's own GitHub
    # release (the archive's SHA-256 is checked before anything is extracted), `build-helper`
    # compiles the native reflection helper against it with g++ (`CXX` below: without it build-helper takes the first of
    # cl, clang++, c++, g++ on PATH, and the runner may have clang++), and the Slangc tier runs with that slangc
    # and helper. The Reflect tier dispatches on a GPU, so it runs in gpu-software (lavapipe), not here. The S3
    # reproducibility check builds the artifacts of examples/vector-add twice with `cargo gust build` and requires
    # byte-identical output (R7: no normalization), then `check --recompile` once more.
    # No GPU here, so no Gpu tier. Not a required check yet (the `unit` precedent: promoted after two weeks of green).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Install the pinned Slang and build the helper
        # The cache is the tool's default, ~/.cargo/gust/slang/<version>. Later steps get the slangc, the SDK (for
        # xtask build-slang-reflect) and the helper through the environment files.
        run: |
          gust() { cargo run --locked --quiet -p cargo-gust -- "$@"; }
          gust slang install
          gust slang locate > "$RUNNER_TEMP/locate.txt"
          cat "$RUNNER_TEMP/locate.txt"
          slangc=$(sed -n 's/^slangc: //p' "$RUNNER_TEMP/locate.txt")
          gust slang build-helper > "$RUNNER_TEMP/helper.txt"
          cat "$RUNNER_TEMP/helper.txt"
          helper=$(sed -n 's/^helper: //p' "$RUNNER_TEMP/helper.txt")
          test -n "$slangc"
          test -n "$helper"
          echo "SLANG_SDK=$(dirname "$(dirname "$slangc")")" >> "$GITHUB_ENV"
          echo "GUST_SLANG_REFLECT=$helper" >> "$GITHUB_ENV"
          dirname "$slangc" >> "$GITHUB_PATH"
      - name: Doctor
        # Must be healthy: the pinned slangc, and a helper built against it.
        run: |
          slangc -version
          cargo run --locked --quiet -p cargo-gust -- doctor
      - name: Slangc tier
        # `--skip-difftest`: the harness steps of the Unit part run in the job `difftest` (printed as skipped).
        run: cargo --locked xtask test --suite Slangc --skip-difftest
      - name: S3 reproducibility (cargo gust build twice)
        run: |
          gust() { cargo run --locked --quiet -p cargo-gust -- "$@"; }
          rm -rf examples/vector-add/gust-artifacts
          gust build -p vector-add
          cp -R examples/vector-add/gust-artifacts "$RUNNER_TEMP/s3-first"
          gust build -p vector-add
          diff -r "$RUNNER_TEMP/s3-first" examples/vector-add/gust-artifacts
          gust check -p vector-add --recompile
      - name: Committed artifacts match the pinned Slang
        # A pin bump without a re-bless fails here: `check --recompile` rebuilds the kernels of tests/precompiled with
        # the pinned slangc and compares them with the committed set. The Unit suite also byte-compares all five
        # committed copies of that set with it (xtask/src/tests/web.rs: the web example's, the two UI fixtures' and
        # the fixtures of gust and gust-wgpu). Measured locally, warm, on the 2026.20 install: 36 s.
        run: >-
          cargo run --locked --quiet -p cargo-gust --
          check -p kernels --manifest-path tests/precompiled/Cargo.toml --recompile

  precompiled:
    # D45, D46: the production-shaped consumer of precompiled kernels (tests/precompiled). `--check-only` is the mode
    # for a runner without an adapter or Slang: it runs the builds and checks of E1 to E8 (the stripped-environment
    # build, the binary scan and `cargo tree`, the mutated and missing artifacts, strict plus dual, the build-script
    # refusals, the re-expansion on a changed GUST_EXPORT_DIR, the `cargo package` allow-lists and the relocated
    # registry-style consumer) and skips what needs a GPU (the runs of E1, E3 and E8) or Slang (`cargo gust build`
    # twice, E7). Those stay local, with the full command `cargo xtask check-precompiled` (which `check-full` also
    # runs). E8 downloads `wgpu` from crates.io. After it, the release `app` that E1 built is run with the Vulkan
    # loader pointed at no driver (R2-4: "expect NoAdapter"); that proves the consumer reaches the adapter request
    # and ends with the error, not that it computes anything. Not covered on CI: the runs of E1, E3 and E8, E7b, and
    # a successful dispatch. Runnable locally in sh form: `cargo --locked xtask check-precompiled --check-only`, then
    # the step below.
    # E6i is a release check of the whole workspace, so it costs minutes here (mr.c review N4).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Precompiled fixture, fmt and clippy
        run: |
          cargo fmt --manifest-path tests/precompiled/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path tests/precompiled/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Precompiled checks E1 to E8
        run: cargo --locked xtask check-precompiled --check-only
      - name: Consumer error messages (unit test)
        # The app prints "no GPU adapter" only for gust-wgpu's NoAdapter error and "GPU initialization failed" for any
        # other error of HeadlessDevice::new; this test pins that, so the grep of the next step means what it says.
        run: cargo test --locked --manifest-path tests/precompiled/Cargo.toml -p app
      - name: Consumer without an adapter (NoAdapter)
        # The consumer asks for Vulkan only, and with no driver file it finds no adapter, also on a runner that has a
        # software Vulkan driver installed. The binary is the release `app` that E1 built. The line it greps for is
        # printed for the NoAdapter error variant only (tests/precompiled/app/src/main.rs), not for any failure.
        run: |
          set +e
          VK_DRIVER_FILES=/nonexistent VK_ICD_FILENAMES=/nonexistent target/precompiled/release/app > run.out 2> run.err
          code=$?
          set -e
          cat run.out run.err
          test "$code" -eq 1
          grep -q "^error: no GPU adapter: " run.err
          if grep -q "^verified:" run.out; then exit 1; fi

  release:
    # The permanent release gate (slice mr.r, D70 extended): `cargo xtask check-release --check-only` packages every
    # publishable crate in one call with verification, judges the file lists, the metadata, the exact internal pins
    # and the publish flags, builds the rustdoc of the library crates with warnings denied (the docs.rs-shaped nightly
    # run only where a nightly toolchain is installed, which it is not here), and builds the README recipe
    # (xtask/src/release/hello-gust) from the unpacked `.crate` files, plus the install of `cargo-gust` from its
    # unpacked package, then a `cargo publish --dry-run`. It takes names from `cargo metadata`, so it needs no edit
    # when the crates are renamed. Skipped here: the runs of the recipe, `cargo gust build` and the release build
    # (Slang and an adapter; `cargo xtask check-release` and `check-full` run them locally). Needs the crates.io
    # registry.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Release checks R1 to R8
        run: cargo --locked xtask check-release --check-only

  wasm:
    # The browser surface of gust-wgpu (D45, R4.9, slice m4.g2): `gust`, `gust-wgpu` and `examples/web-vector-add` lint
    # clean for `wasm32-unknown-unknown` under `GUST_PROFILE=web` (a plain wasm32 check infers `dev`; only `web` is the
    # strict profile). Limits of this compile: it fails when code that stays on wasm32 calls something gated off (for
    # example `pool_read`, whose gate was the one error of the unmodified tree) and when a gated-off helper is left
    # unused, but `Instant` and `mpsc` compile on wasm32, so it cannot prove that no timed or blocking call survives;
    # only a browser run does.
    # This job does not run anything in a browser: `cargo xtask check-web` needs Chrome with a WebGPU adapter and
    # stays local Gpu evidence. Whether a software adapter (SwiftShader) can earn `Gpu (software)` on a hosted runner is
    # slice S4 of the plan, deferred (D69).
    # The MSRV job does not build the wasm32-only dependencies, so nothing checks them against the minimum Rust version.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust with the wasm32 target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Feature guard (webgpu is wasm32 only)
        # `cargo tree -e features`: the wgpu `webgpu` feature is on for wasm32 and not for the host (no browser needed).
        run: cargo --locked xtask check-web --tree-only
      - name: Clippy on wasm32 (strict web profile)
        env:
          GUST_PROFILE: web
        run: cargo clippy --locked --target wasm32-unknown-unknown -p gust -p gust-wgpu -p web-vector-add -- -D warnings
