# Gpu (software) evidence (docs/development/VALIDATION.md, D52): the whole Gpu suite on Mesa lavapipe, a conforming
# software Vulkan implementation, on a hosted runner. It is execution evidence on a second adapter, never hardware
# evidence, and never a required check: a red run is visible on every pull request and blocks nothing.
#
# Order: Mesa from the Ubuntu snapshot service (pinned by snapshot id and package version, drift-checked), Slang and the
# reflection helper from the pinned-Slang manager (`cargo gust slang install` and `build-helper`; the version is `SLANG_PIN` in
# crates/gust/src/toolchain.rs and the archive hash lives in crates/cargo-gust/src/slang.rs, nowhere else), doctor, then `cargo xtask verify --mode gpu
# --record`, which also checks the `test result:` lines against the pinned counts (GPU_SUITE_PIN, in
# xtask/src/verify.rs; `cargo xtask test --suite Gpu` checks the same pin), then assertions on the record. The Mesa
# install retries each download five times and the whole install once more after 60 s (the snapshot service has
# answered 503/504); the pinned snapshot and the identity assertions are unchanged.
#
# One job, two lists (plan M5 R1-10). The list of a pull request, a push to main or release/* and a dispatch without
# `extended` is everything above, plus the differential test on 2 seeds (32 generated programs on three parties: the
# interpreter, the CPU twin and the lavapipe GPU; R1-13) and the same 2 seeds again with `--shapes grid,pixel` (every
# program the classifier admits also as a `pixel` kernel, slice mx.z; the nightly list runs it on 2 seeds too). The
# nightly list (`schedule`, 03:00 UTC, and a dispatch with `extended`, the default) adds the steps marked "nightly list": `cargo xtask check-examples` and the release-profile mismatch ledger
# (`cargo xtask check-ledger`, guarded as the Full mode is: no ignored test, every ledger test named), and runs the
# differential test on seeds 1-72 (1152 programs: the reach of the CPU test that proves the generator writes every
# aggregate form, DIFFTEST) in place of the 2. Slices that grow the nightly list add
# steps behind the same condition. Moving a step to the pull request list is deleting its `if:` line, and it is allowed
# only while the measured warm job time of a pull request stays at five minutes or less (the budget rule; STATUS names
# each list and its measured time). The nightly steps after the differential test carry `!cancelled() &&` in that
# line, so that a failing differential test does not skip them; the job still fails. One pull request step is admitted
# over the budget: the cross-shape differential test, by the MX close (close ruling 4, recorded as D129), measured at
# 25 s on a warm runner (run 42071043309). No other step is. The `+subgroups` step (m8.w2) is on the pull request list
# inside the budget: about 4 s on a warm runner (run 42328392310, 02:20:00Z to 02:20:04Z; the new profile recompiled only
# gust-compute and gust-compute-wgpu, 1.98 s, and the shared CARGO_TARGET_DIR stays).
#
# Slice m8.e adds a second batch to every `check-difftest` (the same seeds under `dev+subgroups`; its exported
# records must be byte for byte those of the `dev` batch, and every program reports the capabilities of its own
# build) and the strict `subgroup-reduce` run (GUST_PROFILE=native+subgroups) to `check-examples`. D146 asked for a
# branch dispatch before any lavapipe step is wired: run 42461935960 (lane/m8.e, `extended`, Mesa 25.2.8, subgroup
# size 8, job 18 min 53 s of the 40-minute timeout) passed. Nightly differential step: 626 s (seeds 1-72, the `dev`
# batch 1152 programs and the `dev+subgroups` batch 1152 programs, 0 mismatches in both, about 298 s for the second,
# 2304 record files equal). Cross-shape step: 37.6 s (two batches of 32 programs, about 18 s each; it was 25 s with
# one batch). `check-examples`: 97 s, of which the strict `subgroup-reduce` run (lane count 8, 38 subgroups over 300
# invocations) is about 22 s with its build. The pull request list's differential step (2 seeds) was not timed by
# this dispatch, which ran the nightly list; its second batch costs about what its first does, so expect that step to
# roughly double (an estimate, not a measurement). The time budgets above are from before m8.e.
name: gpu-software

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      extended:
        description: "Also run the nightly list (check-examples, the release ledger, difftest seeds 1-72)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # The nightly run has a group of its own, so that a push to main or release/* cannot replace it while it waits.
  group: gpu-software-${{ github.event_name == 'schedule' && 'nightly-' || '' }}${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main and release/* are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned here so a new stable release cannot change CI without a commit (same pin as ci.yml).
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Mesa, R1-11. Changing the Mesa version is a deliberate commit that edits these three strings. The snapshot id is a
  # UTC timestamp of the Ubuntu archive; the version is the Ubuntu package version, which `driver_info` repeats.
  SNAPSHOT_ID: "20261101T110000Z"
  MESA_VERSION: "25.2.8-0ubuntu0.24.04.4"
  # The whole `driver_info` of the record, LLVM included (the LLVM libraries are dependencies of the Mesa package).
  MESA_DRIVER_INFO: "Mesa 25.2.8-0ubuntu0.24.04.4 (LLVM 20.1.2)"
  # Lavapipe is the only Vulkan device, even if a runner image ever exposes another driver.
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json

jobs:
  gpu-software:
    runs-on: ubuntu-24.04
    # The pull request list is budgeted at five minutes warm; the timeout is a guard against a hang, longer for the
    # nightly list.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.extended) && 40 || 20 }}
    env:
      # 'true' for the nightly list; empty (a pull request or a push) or 'false' otherwise. The steps of the nightly
      # list test for 'true'.
      GPU_SOFTWARE_NIGHTLY: ${{ github.event_name == 'schedule' || inputs.extended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Prepare the artifact directory
        run: mkdir -p "$RUNNER_TEMP/gpu-software-artifact"
      - name: Install Mesa and the tools from the Ubuntu snapshot
        # The snapshot is the only source of this install (stricter than R1-11, which allowed the runner's mirror with
        # a `Snapshot:` field): sources and apt lists are redirected with -o, so nothing floats to the live archive.
        run: |
          set -euo pipefail
          # The snapshot service answered 503/504 in three runs: five retries per file and a 30 s timeout
          # per request, then one more try of the whole install after 60 s (below). The pinned snapshot, the packages
          # and the identity assertions of the next step are unchanged; there is no fallback mirror (D52).
          apt_get() {
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 "$@"
          }
          packages=("mesa-vulkan-drivers=$MESA_VERSION" vulkan-tools build-essential pkg-config spirv-tools)
          echo "::notice::apt source: https://snapshot.ubuntu.com/ubuntu/$SNAPSHOT_ID/ only, for this install"
          dir="$RUNNER_TEMP/apt-snapshot"
          mkdir -p "$dir/sources.list.d" "$dir/lists/partial"
          cat > "$dir/sources.list.d/ubuntu-snapshot.sources" <<EOF
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/$SNAPSHOT_ID/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          options=(-o Dir::Etc::sourcelist=/dev/null -o "Dir::Etc::sourceparts=$dir/sources.list.d"
            -o "Dir::State::lists=$dir/lists")
          install_mesa() {
            apt_get "${options[@]}" update && apt_get "${options[@]}" install --yes "${packages[@]}"
          }
          if ! install_mesa; then
            echo "::warning::the Mesa install from the snapshot failed; trying the whole install once more in 60 s"
            sleep 60
            install_mesa
          fi
      - name: Check that Mesa did not drift, and that lavapipe is the device
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/gpu-software-artifact/environment.txt"
          {
            echo "snapshot id: $SNAPSHOT_ID"
            echo "pinned Mesa package: $MESA_VERSION"
            apt-cache policy mesa-vulkan-drivers
            dpkg-query -W mesa-vulkan-drivers libllvm20 spirv-tools vulkan-tools libvulkan1
          } | tee "$env_file"
          installed=$(apt-cache policy mesa-vulkan-drivers | awk '/^ *Installed:/ { print $2 }')
          if [ "$installed" != "$MESA_VERSION" ]; then
            echo "::error::mesa-vulkan-drivers is $installed, the pin is $MESA_VERSION"
            exit 1
          fi
          test -f "$VK_DRIVER_FILES"
          vulkaninfo --summary 2>&1 | tee -a "$env_file"
      - name: Cache cargo and the target directory
        # `target/slang-reflect` is left out: a helper restored from an older cache was judged up to date by its file
        # times and then failed to load the Slang library of another install (m5.a2 run 41346473154; since m4.z
        # freshness is a source-hash stamp, but the helper still need not outlive the job). The helper of
        # this job is the manager's, built every run (GUST_SLANG_REFLECT).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/slang-reflect
          key: gpu-software-cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gpu-software-cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Read the Slang pin
        # The cache key below is the manager's pin: the version (SLANG_PIN, read out of crates/gust/src/toolchain.rs) and
        # the SHA-256 of the linux x86_64 archive of that version (read out of crates/cargo-gust/src/slang.rs). It is not
        # a hash of a file: an unrelated edit would then drop the cache, and this key says in the log which Slang it is.
        # The step fails (never guesses) when either value cannot be read, so a change of the layout is loud.
        run: |
          set -euo pipefail
          file=crates/cargo-gust/src/slang.rs
          pin_file=crates/gust/src/toolchain.rs
          version=$(tr -d '\r' < "$pin_file" | sed -n 's/^pub const SLANG_PIN: &str = "\([^"]*\)";$/\1/p')
          sha256=$(tr -d '\r' < "$file" | awk -F'"' '
            /Asset \{/ { current = 0; os = ""; arch = "" }
            /^ *version: SLANG_VERSION,/ { current = 1 }
            /^ *os: / { os = $2 }
            /^ *arch: / { arch = $2 }
            /^ *sha256: / && current && os == "linux" && arch == "x86_64" { print $2 }')
          one() {
            count=$(printf '%s\n' "$1" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly one $2 in ${3:-$file}, found $count"
              exit 1
            fi
          }
          one "$version" "SLANG_PIN line" "$pin_file"
          one "$sha256" "linux x86_64 sha256 line of the pinned version"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "::error::cannot read SLANG_PIN from $pin_file (got '$version')"
            exit 1
          fi
          if ! printf '%s\n' "$sha256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::cannot read the linux x86_64 SHA-256 of Slang $version from $file (got '$sha256')"
            exit 1
          fi
          echo "Slang pin: $version, linux x86_64 archive $sha256"
          {
            echo "SLANG_PIN_VERSION=$version"
            echo "SLANG_PIN_SHA256=$sha256"
            # The manager's cache root. Explicit, so that it is the one directory the cache step below saves.
            echo "GUST_SLANG_HOME=$RUNNER_TEMP/gust-slang"
          } >> "$GITHUB_ENV"
      - name: Cache the Slang release
        id: slang-cache
        # Only the extracted release, <root>/<version>. The helper is rebuilt every run (a few seconds with g++), so
        # that a cached helper can never outlive a change of its source.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gust-slang/${{ env.SLANG_PIN_VERSION }}
          key: gpu-software-slang-${{ runner.os }}-${{ env.SLANG_PIN_VERSION }}-${{ env.SLANG_PIN_SHA256 }}
      - name: Install the pinned Slang and build the helper
        # `cargo gust slang install` downloads the archive from Slang's own GitHub release and checks its SHA-256 before
        # anything is extracted; on a cache hit it finds the release and downloads nothing. Later steps get the slangc,
        # the SDK (for xtask) and the helper through the environment files, so xtask finds the manager's helper through
        # GUST_SLANG_REFLECT and builds none of its own.
        env:
          CXX: g++
          SLANG_CACHE_HIT: ${{ steps.slang-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Nothing in this job uses it; a stale one from an older cache must not be found by accident.
          rm -rf target/slang-reflect
          key="gpu-software-slang-$RUNNER_OS-$SLANG_PIN_VERSION-$SLANG_PIN_SHA256"
          echo "Slang cache hit: ${SLANG_CACHE_HIT:-false} (key $key)"
          gust() { cargo run --locked --quiet -p cargo-gust -- "$@"; }
          gust slang install
          gust slang locate > "$RUNNER_TEMP/locate.txt"
          cat "$RUNNER_TEMP/locate.txt"
          slangc=$(sed -n 's/^slangc: //p' "$RUNNER_TEMP/locate.txt")
          gust slang build-helper > "$RUNNER_TEMP/helper.txt"
          cat "$RUNNER_TEMP/helper.txt"
          helper=$(sed -n 's/^helper: //p' "$RUNNER_TEMP/helper.txt")
          test -n "$slangc"
          test -n "$helper"
          {
            echo "SLANG_SDK=$(dirname "$(dirname "$slangc")")"
            echo "GUST_SLANG_REFLECT=$helper"
          } >> "$GITHUB_ENV"
          dirname "$slangc" >> "$GITHUB_PATH"
      - name: Doctor
        # Must be healthy: the pinned slangc, and the manager's helper built against it (as in ci.yml). Not `xtask
        # doctor`, which checks and rebuilds a helper of its own under target/slang-reflect.
        run: |
          slangc -version
          cargo run --locked --quiet -p cargo-gust -- doctor
      - name: Gpu suite on lavapipe
        # The log is kept outside the workspace so that it cannot make the recorded tree dirty. The check of the
        # `test result:` lines against the pinned counts is part of the command (a failure names both numbers).
        run: |
          set -o pipefail
          cargo --locked xtask verify --mode gpu --record 2>&1 | tee "$RUNNER_TEMP/gpu-suite.log"
      - name: Assert the adapter record is lavapipe
        run: |
          set -euo pipefail
          record=.ai/VALIDATION.json
          grep -Fq '"device_type": "Cpu"' "$record"
          grep -Eq '^ *"name": "[^"]*llvmpipe' "$record"
          grep -Fq "\"driver_info\": \"$MESA_DRIVER_INFO\"" "$record"
      - name: Differential test (2 seeds; all 8 in the nightly list)
        id: difftest
        # `cargo xtask check-difftest` (m5.c2) runs `difftest-run` on lavapipe, reads its report.json, and fails unless
        # `programs_executed` is 16 times the seeds, nothing disagreed and an adapter is named; it also runs the
        # short_circuit GPU test of tests/difftest. Every failure line starts with `check-difftest:` and names the
        # seed (the next step turns those lines into annotations). The report goes straight into the artifact
        # directory, which is uploaded even when this step fails. Same Slang, helper and VK_DRIVER_FILES as the Gpu
        # suite above. Pull request list: seeds 1-2 (32 programs); nightly list: 1-72 (1152 programs). Measured on this
        # job (run 41442659698, seeds 1-8: 45.5 s of `difftest-run` for 128 programs; run 41518009197 at format 6, seeds
        # 1-2: 9.2 s for 32), 72 seeds are expected to take 5 to 7 minutes of the nightly job's 40-minute timeout. The
        # step name is pinned by a test in xtask/src/tests/suite.rs and still says "all 8".
        # Since m8.e the command also runs the batch again under `dev+subgroups` and compares the records (the head of
        # this file has the measured cost): 626 s on the nightly list in run 42461935960, where the estimate above
        # counted one batch.
        run: |
          set -o pipefail
          seeds=1-2
          if [ "$GPU_SOFTWARE_NIGHTLY" = "true" ]; then seeds=1-72; fi
          echo "difftest seeds: $seeds"
          cargo --locked xtask check-difftest --seeds "$seeds" \
            --report "$RUNNER_TEMP/gpu-software-artifact/difftest-report.json" 2>&1 | tee "$RUNNER_TEMP/difftest.log"
      - name: Cross-shape differential test (pixel against grid, 2 seeds)
        id: difftest_shapes
        # The same command with `--shapes grid,pixel` (slice mx.p1c; mx.z): every program runs as a `grid` kernel, and
        # as a `pixel` kernel when the classifier admits it, on the lavapipe GPU. Integer and `bool` outputs must be
        # equal bit for bit, and an `f32` output is judged against the interpreter's interval (D128). It is on the pull
        # request list because the harness path of the pixel shape once broke main unseen (fix.p1c-ci) while only
        # `check-full` ran it. Seeds 1-2 in both lists (the nightly seeds stay grid-only); the report is a file of its
        # own. `!cancelled()` and not the implicit `success()`, as the nightly steps below: a red plain differential
        # test must not skip this one. The step has no condition on GPU_SOFTWARE_NIGHTLY, so both lists run it. Pinned
        # by `only_full_and_one_gpu_software_step_ask_for_pixel` in xtask/src/tests/difftest.rs. Measured at 25 s with
        # its build on a warm runner (run 42071043309).
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo --locked xtask check-difftest --seeds 1-2 --shapes grid,pixel \
            --report "$RUNNER_TEMP/gpu-software-artifact/difftest-shapes-report.json" 2>&1 | tee "$RUNNER_TEMP/difftest-shapes.log"
      - name: Subgroups on lavapipe (dev+subgroups)
        # The `+subgroups` build (m8.w2, D142); the Gpu suite above runs under `dev`, which requests no capability. Spike
        # S3 measured this lavapipe (Mesa 25.2.8) with SUBGROUP, subgroup sizes 8..8, and all 43 cells passing, so this
        # is a step and not a "not run" row. `cargo xtask test --suite Gpu --profile dev+subgroups --test <target>`
        # builds gust-compute-wgpu with GUST_PROFILE=dev+subgroups, runs that one test target with `--show-output`,
        # requires the `[Subgroups]` line of tests/capabilities.rs (the profile reached the build), and counts the result
        # against GPU_TARGET_PINS in xtask/src/verify.rs. What runs is the device decision (`tests/subgroup.rs`: a
        # `requires(subgroups)` descriptor is refused without the capability and runs with it, and the SubgroupSize rule
        # on lavapipe's 8..8 range; `tests/capabilities.rs`: the default device holds the build's set). Since m8.s
        # `tests/subgroup.rs` also runs the subgroup operations of the fixtures against a host model (selected only
        # under this profile); the device-decision tests use plain Slang with hand-written `requires` descriptors.
        # The Gpu suite step above already runs both files on this lavapipe under `dev`. This step comes after the
        # cross-shape test and has `!cancelled()`, so that a red differential test neither skips this step nor is skipped
        # by it. No condition on GPU_SOFTWARE_NIGHTLY: both lists run it, a pull request
        # included. Pinned by `gpu_software_runs_the_subgroup_targets_under_the_profile` in xtask/src/tests/suite.rs.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo --locked xtask test --suite Gpu --profile dev+subgroups --test subgroup 2>&1 | tee "$RUNNER_TEMP/gpu-subgroups.log"
          cargo --locked xtask test --suite Gpu --profile dev+subgroups --test capabilities 2>&1 | tee -a "$RUNNER_TEMP/gpu-subgroups.log"
      - name: Name the failing seeds
        if: failure() && (steps.difftest.outcome == 'failure' || steps.difftest_shapes.outcome == 'failure')
        env:
          PLAIN_OUTCOME: ${{ steps.difftest.outcome }}
          SHAPES_OUTCOME: ${{ steps.difftest_shapes.outcome }}
        run: |
          # Only the log of a step that failed: a passing one prints `check-difftest:` info lines too.
          if [ "$PLAIN_OUTCOME" = "failure" ]; then
            grep -h -E '^check-difftest: ' "$RUNNER_TEMP/difftest.log" | sed 's/^/::error::/' || true
          fi
          if [ "$SHAPES_OUTCOME" = "failure" ]; then
            grep -h -E '^check-difftest: ' "$RUNNER_TEMP/difftest-shapes.log" | sed 's/^/::error::/' || true
          fi
      - name: Keep the ledger lines of the debug run
        # The release run below writes the same file names, so the debug run's are moved aside first.
        if: always()
        run: |
          shopt -s nullglob
          for file in target/tmp/ledger-*.txt; do
            mv -f "$file" "$RUNNER_TEMP/gpu-software-artifact/debug-$(basename "$file")"
          done
      - name: Examples on lavapipe (nightly list)
        # `!cancelled()` and not the implicit `success()`: a red differential test must not skip the nightly evidence
        # below (the job still fails, because the difftest step did). The expression form, because a bare `!` starts
        # a YAML tag.
        if: ${{ !cancelled() && env.GPU_SOFTWARE_NIGHTLY == 'true' }}
        run: |
          set -o pipefail
          cargo --locked xtask check-examples 2>&1 | tee "$RUNNER_TEMP/check-examples.log"
      - name: Mismatch ledger in the release profile (nightly list)
        # The ledger asserts the plain-Rust outcome of its mode-keyed rows for the `overflow-checks` mode it detects at
        # run time (D38); the Gpu suite above is the debug run, this is the release run (the second of the two that the
        # Full mode makes, xtask RELEASE_LEDGER_TEST). `cargo xtask check-ledger` runs exactly that call and applies the
        # guard of the Full mode: at least one test ran, 0 failed, 0 ignored, and each ledger test named in xtask
        # RELEASE_LEDGER_TESTS reported ok, so an `#[ignore]`d or renamed ledger test turns this step red. xtask gives
        # every cargo child GUST_PROFILE=dev. The call has `--nocapture`, so the log below carries the adapter, the
        # detected overflow mode and the `S2 |` rows; the ledger files carry one line per case.
        if: ${{ !cancelled() && env.GPU_SOFTWARE_NIGHTLY == 'true' }}
        run: |
          set -o pipefail
          cargo --locked xtask check-ledger 2>&1 | tee "$RUNNER_TEMP/ledger-release.log"
      - name: Collect the evidence
        if: always()
        run: |
          cp -f .ai/VALIDATION.json "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/gpu-suite.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/gpu-subgroups.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/difftest.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/difftest-shapes.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/check-examples.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          cp -f "$RUNNER_TEMP/ledger-release.log" "$RUNNER_TEMP/gpu-software-artifact/" || true
          # Only the release run can have written these now: the debug run's were moved aside.
          shopt -s nullglob
          for file in target/tmp/ledger-*.txt; do
            cp -f "$file" "$RUNNER_TEMP/gpu-software-artifact/release-$(basename "$file")"
          done
      - name: Upload the record and the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-software-${{ github.run_id }}
          path: ${{ runner.temp }}/gpu-software-artifact
          if-no-files-found: warn
