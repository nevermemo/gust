[workspace]
members = [
    "crates/gust",
    "crates/gust-macros",
    "crates/gust-wgpu",
    "crates/cargo-gust",
    "crates/gust-algo",
    "examples/atomic-counter",
    "examples/cell-bins",
    "examples/buffer-handoff",
    "examples/component-pool",
    "examples/field-relax",
    "examples/hash-rng",
    "examples/map-chain",
    "examples/mc-histogram",
    "examples/polynomial",
    "examples/particle-step",
    "examples/polar-transform",
    "examples/shape-bench",
    "examples/signal-pipeline",
    "examples/staged-graph",
    "examples/subgroup-reduce",
    "examples/texture-threshold",
    "examples/typed-pipeline",
    "examples/vector-add",
    "examples/walker-steer",
    "examples/walker-transport",
    "examples/walker-life",
    "examples/event-drain",
    "examples/task-basics",
    "examples/web-vector-add",
    "xtask",
]
default-members = ["examples/vector-add"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/nevermemo/gust"
keywords = ["gpu", "compute", "slang", "wgpu", "compiler"]
categories = ["compilers", "graphics", "wasm"]
# No `homepage` and no inherited `readme`: cargo finds each crate's own `README.md` by itself.

[workspace.dependencies]
# The three library crates and `cargo-gust` are released together at one version, and the macro emits items that only
# the same release of `gust` has, so their internal dependencies are exact (`=`), never a range.
gust = { package = "gust-compute", version = "=0.2.0", path = "crates/gust" }
gust-macros = { package = "gust-compute-macros", version = "=0.2.0", path = "crates/gust-macros" }
gust-wgpu = { package = "gust-compute-wgpu", version = "=0.2.0", path = "crates/gust-wgpu" }
pollster = "0.4"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

# `cfg(gust_dual)` is set by `cargo xtask check-dual` through CARGO_ENCODED_RUSTFLAGS (D26), not by cargo, so rustc's
# check-cfg must be told about it or every hand-written use warns (and fails clippy -D warnings). Every member that
# can write such a cfg opts in with `[lints] workspace = true`; `gust-macros`, a proc-macro crate that only emits the
# cfg as tokens into the user's crate and never evaluates it, does not. `cfg(gust_profile = "..")` (D44) is set by
# `gust`'s build script for `gust` alone, which declares it itself; it is listed here too so that a member that reads
# it, as `gust` may in its own sources, never warns.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gust_dual)', 'cfg(gust_profile, values("dev", "native", "web", "cpu"))'] }

# m13.profile: line tables only (file:line in backtraces stays, variable-level debug info goes) so debug builds link and
# load faster. Measured with rust-lld below: the incremental macro-edit gate got 25-31 % faster.
[profile.dev]
debug = "line-tables-only"

# m14.optlvl: the host-side work of the gust-algo tests (reference sums and fills over 2^24-2^26 elements) runs as
# debug Rust, which dominates their run time. Optimising only this package roughly halves that run, and every rebuild
# of its test targets costs only a few seconds more. `gust-compute-wgpu` is left out on purpose: its test targets are
# many, and rebuilding them optimised costs more than the run time saved. Cargo's dev profile sets `overflow-checks =
# true` and `debug-assertions = true` as their own settings, and a package override that sets only `opt-level` leaves
# both on, so `debug_assert!` and integer-overflow panics stay on. (Cargo still prints `unoptimized` in its `Finished`
# line; it describes the root profile.)
[profile.dev.package.gust-algo]
opt-level = 3
