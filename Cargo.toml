[workspace]
members = [
    "crates/gust",
    "crates/gust-macros",
    "crates/gust-wgpu",
    "crates/cargo-gust",
    "crates/gust-algo",
    "examples/atomic-counter",
    "examples/component-pool",
    "examples/map-chain",
    "examples/polynomial",
    "examples/particle-step",
    "examples/shape-bench",
    "examples/signal-pipeline",
    "examples/staged-graph",
    "examples/texture-threshold",
    "examples/typed-pipeline",
    "examples/vector-add",
    "examples/web-vector-add",
    "xtask",
]
default-members = ["examples/vector-add"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/nevermemo/gust"
keywords = ["gpu", "compute", "slang", "wgpu", "compiler"]
categories = ["compilers", "graphics", "wasm"]
# No `homepage` and no inherited `readme`: cargo finds each crate's own `README.md` by itself.

[workspace.dependencies]
# The three library crates and `cargo-gust` are released together at one version, and the macro emits items that only
# the same release of `gust` has, so their internal dependencies are exact (`=`), never a range.
gust = { package = "gust-compute", version = "=0.2.0-dev", path = "crates/gust" }
gust-macros = { package = "gust-compute-macros", version = "=0.2.0-dev", path = "crates/gust-macros" }
gust-wgpu = { package = "gust-compute-wgpu", version = "=0.2.0-dev", path = "crates/gust-wgpu" }
pollster = "0.4"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

# `cfg(gust_dual)` is set by `cargo xtask check-dual` through CARGO_ENCODED_RUSTFLAGS (D26), not by cargo, so rustc's
# check-cfg must be told about it or every hand-written use warns (and fails clippy -D warnings). Every member that
# can write such a cfg opts in with `[lints] workspace = true`; `gust-macros`, a proc-macro crate that only emits the
# cfg as tokens into the user's crate and never evaluates it, does not. `cfg(gust_profile = "..")` (D44) is set by
# `gust`'s build script for `gust` alone, which declares it itself; it is listed here too so that a member that reads
# it, as `gust` may in its own sources, never warns.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gust_dual)', 'cfg(gust_profile, values("dev", "native", "web", "cpu"))'] }
