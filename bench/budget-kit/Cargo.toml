[package]
name = "budget-kit"
description = "A GPU budget kit: how much compute work of a few common shapes fits in one frame"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gust = { package = "gust-compute", path = "../../crates/gust" }
gust-wgpu = { package = "gust-compute-wgpu", path = "../../crates/gust-wgpu", features = ["slang-runtime"] }
# The reduction and the scan of the kit (W4, W5); the run-time compile feature is the one `gust-wgpu` has here.
gust-algo = { path = "../../crates/gust-algo", features = ["slang-runtime"] }

[lints]
workspace = true
