[package]
name = "gust-bench-pre"
description = "The same benchmark harness built in a crate of its own, so that its kernels embed precompiled artifacts (gust-artifacts/ here) while gust-bench keeps compiling at run time"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gust = { package = "gust-compute", path = "../../crates/gust" }
gust-wgpu = { package = "gust-compute-wgpu", path = "../../crates/gust-wgpu" }
bytemuck = "=1.25.2"
pollster = "=0.4.0"
rayon = "=1.12.0"
serde_json = "=1.0.145"
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "vulkan", "wgsl"] }

# Windows only: the sampler reads the GPU-engine performance counters (PDH), the process table (ToolHelp) and the
# adapter LUIDs (DXGI). windows 0.62.2 is MIT OR Apache-2.0 and is already in the lock through wgpu-hal.
[target.'cfg(windows)'.dependencies]
# One line on purpose: `cargo xtask lint` reads one dependency per line.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Threading"] }

# The harness sources are gust-bench's own and read these features by name. Here they are inert: this package is
# always a GPU build, and it is the precompiled, no-Slang variant, so the run-time compiler and the SPIR-V route (which
# needs it) are never on. It is built with GUST_PROFILE=native, which refuses `slang-runtime` and requires an artifact
# for every kernel: the build itself guarantees that a kernel can only come from its embedded artifact, and the harness
# reads that guarantee (`gust::profile::STRICT`) into the route event of a cold start.
# `spirv-route` is declared only so the shared sources' `cfg(feature = "spirv-route")` is a known cfg; it stays off here
# (an artifact build has no SPIR-V route). `profile-counts` and `wgpu-trace` are declared for the same reason and stay
# off: the `profile` and `trace` subcommands are gust-bench's.
[features]
default = ["gpu"]
gpu = []
slang-runtime = []
spirv-route = []
profile-counts = []
wgpu-trace = []

[lints]
workspace = true

# The harness sources are gust-bench's own. The #[gpu] expansion looks for `gust-artifacts/` beside the Cargo.toml of
# the package that compiles it, so this package is the precompiled variant: `cargo gust build --manifest-path
# bench/gust-bench-pre/Cargo.toml` writes the artifacts, and a build of this package embeds them. A binary of its own
# name keeps its output apart from gust-bench's. Its tests are the precompiled-route test only (the rest run in
# gust-bench); run them with `cargo test -p gust-bench-pre` alone.
[[bin]]
name = "gust-bench-pre"
path = "../gust-bench/src/main.rs"
