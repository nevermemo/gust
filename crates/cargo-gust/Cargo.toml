[package]
name = "cargo-gust"
description = "Export tool for GUST: collects #[gpu] kernels, compiles them with Slang, writes gust-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools::cargo-plugins"]
# A binary-only crate has no docs.rs page, so the documentation is its README on GitHub.
documentation = "https://github.com/nevermemo/gust/blob/main/crates/cargo-gust/README.md"
# The unit tests live beside the sources and read repository paths, so they do not ship (they run from the repository).
exclude = ["src/*_tests.rs", "src/testdata.rs", "src/testdata/"]

[[bin]]
name = "cargo-gust"
path = "src/main.rs"

# The tool compiles and verifies kernels, so it needs the run-time Slang bridge that production builds refuse (D44).
# It must therefore be built under GUST_PROFILE=dev, which the repository's xtask does for its children.
[dependencies]
gust = { workspace = true, features = ["slang-runtime"] }

[lints]
workspace = true
