[package]
name = "cargo-gust"
description = "Export tool for GUST: collects #[gpu] kernels, compiles them with Slang, writes gust-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools::cargo-plugins"]
# A binary-only crate has no docs.rs page, so the documentation is its README on GitHub.
documentation = "https://github.com/nevermemo/gust/blob/main/crates/cargo-gust/README.md"
# The unit tests live beside the sources and read repository paths, so they do not ship (they run from the repository).
exclude = ["src/*_tests.rs", "src/testdata.rs", "src/testdata/"]

[[bin]]
name = "cargo-gust"
path = "src/main.rs"

# The tool compiles and verifies kernels, so it needs the run-time Slang bridge that production builds refuse (D44).
# The repository's xtask builds it under GUST_PROFILE=dev. A plain `cargo install cargo-gust` has no such variable,
# so it also enables the internal `cargo-gust-bridge` feature (D108), which makes a release build without
# GUST_PROFILE `dev` for `gust`'s build script. The exact pin of D107 (the workspace version, `=0.2.0-dev` until the
# release) stays in the workspace entry: with `workspace = true`, `features` adds to the features of that entry and
# cannot change its version requirement.
[dependencies]
gust = { workspace = true, features = ["slang-runtime", "cargo-gust-bridge"] }

[lints]
workspace = true
