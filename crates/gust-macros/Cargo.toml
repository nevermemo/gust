[package]
name = "gust-compute-macros"
description = "Direct Rust syntax to Slang translator for GUST"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/gust-compute-macros"
exclude = ["tests/", "examples/", "benches/", "src/slang/collision_tests.rs"]

# The package is `gust-compute-macros` (D48, D106); the library keeps the name `gust_macros`.
[lib]
name = "gust_macros"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
# The reader of the crate's `[package.metadata.gust]` tables (M8, D137; read by m8.a, unused until then). `cargo
# publish` rewrites a manifest, so a dependent's tables arrive as headers and literal strings that a hand-written
# subset would refuse; `de::DeTable` keeps the spans for GUST-E0753. No serde: only `std` and `parse`.
toml = { version = "1", default-features = false, features = ["std", "parse"] }
