[package]
name = "gust-compute-macros"
description = "Direct Rust syntax to Slang translator for GUST"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/gust-compute-macros"
exclude = ["tests/", "examples/", "benches/", "src/slang/collision_tests.rs"]

# The package is `gust-compute-macros` (D48, D106); the library keeps the name `gust_macros`.
[lib]
name = "gust_macros"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
