[package]
name = "gust-compute-wgpu"
description = "Cached headless wgpu backend for Rust-to-Slang kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/gust-compute-wgpu"
exclude = ["tests/", "examples/", "benches/", "clippy.toml"]

# The package is `gust-compute-wgpu` (D48, D106); the library keeps the name `gust_wgpu`.
[lib]
name = "gust_wgpu"

# docs.rs builds with the run-time compile feature on, for the native target and for the browser backend.
[package.metadata.docs.rs]
features = ["slang-runtime"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
# Compile a kernel at run time through `gust/slang-runtime` (the native reflection helper). Off by default (D44):
# without it the crate has no process-spawning compiler, and a run-time compile returns an error.
slang-runtime = ["gust/slang-runtime"]
# The opt-in SPIR-V route (m9.rt2, D172, D174): on a Vulkan device with PASSTHROUGH_SHADERS the kernel's own slangc SPIR-V
# is handed to the driver, and the kernels are emitted with the guards that naga adds on the WGSL route. Off by default
# (the WGSL route is the one that is tested everywhere); every other case falls back to WGSL and says so
# (`HeadlessDevice::route_events`). Native Vulkan only; has no effect on wasm32. Needs `slang-runtime` to take effect.
spirv-route = ["gust/spirv-route"]

[dependencies]
gust.workspace = true
wgpu.workspace = true

# The blocking wrappers drive the async functions with it; the browser has no thread to block (R4.9), so wasm32 does
# not build it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# The browser backend, for wasm32 only (R4.9, D45): the workspace turns wgpu's default features off, so `webgpu` is not
# reachable otherwise, and a native build must not gain it. wgpu 30 vendors its WebGPU bindings, so no unstable cfg flag
# is needed. `cargo xtask check-web` runs the result in Chrome.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

# Cargo unifies the features of a package with those of its dev-dependency on itself, so every `cargo test -p gust-compute-wgpu`
# builds the tests with the bridge; without this line they do not compile.
[dev-dependencies]
gust-wgpu = { package = "gust-compute-wgpu", path = ".", features = ["slang-runtime"] }

[lints]
workspace = true
