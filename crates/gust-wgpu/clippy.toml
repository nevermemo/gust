# Browser guard for gust-wgpu (M4 close note (ii) of the g2 review, slice m4.z item 6).
#
# `std::thread::sleep` and `std::time::Instant::now` panic when they run on wasm32-unknown-unknown, so no code that is
# compiled for the browser may call them. CI's wasm32 job (`ci.yml`, "Clippy on wasm32 (strict web profile)") runs
# `cargo clippy --locked --target wasm32-unknown-unknown -p gust-compute -p gust-compute-wgpu -p web-vector-add -- -D warnings` under
# GUST_PROFILE=web, which fails on a call in gust-wgpu that is not gated out. Native code is allowed to call them:
# `src/lib.rs` carries `#![cfg_attr(not(target_arch = "wasm32"), allow(clippy::disallowed_methods))]` and the
# integration tests that time themselves carry the same line.
#
# This file covers gust-wgpu only. The crates `gust` and `web-vector-add` are built for wasm32 too and have no such ban
# yet (a follow-up). A clippy.toml in a crate replaces the root one for that crate; the root file bans only `syn`
# items, which this crate does not use.

disallowed-methods = [
    { path = "std::thread::sleep", reason = "panics on wasm32: gate it with cfg(not(target_arch = \"wasm32\"))" },
    { path = "std::time::Instant::now", reason = "panics on wasm32: gate it with cfg(not(target_arch = \"wasm32\"))" },
]
