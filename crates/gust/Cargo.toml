[package]
name = "gust-compute"
description = "Rust-shaped Slang frontend types, descriptors, and compiler bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/gust-compute"
exclude = ["tests/", "examples/", "benches/"]

# The package is `gust-compute` (D48, D106); the library keeps the name `gust`, so `use gust::..` and the `::gust::`
# paths of the macro's output stay as they are.
[lib]
name = "gust"

# docs.rs builds with the run-time bridge on so that `gust::slang::compile*` and `gust::reflect::reflect*` have pages.
[package.metadata.docs.rs]
features = ["slang-runtime"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The run-time Slang bridge: compiling and reflecting a kernel by launching `slangc` or the native reflection helper
# (`slang::compile*`, `reflect::reflect`, `reflect::compile_reflected*`, `slang::probe`). Off by default (D44):
# a production build must contain no process-spawning compiler. `slang::Target`, `slang::Error`, `reflect::Error`,
# `reflect::Reflection` and `artifact::verify_artifact` need no feature, so a precompiled artifact is verified without it.
# The repository enables the feature in its examples and, through the self dev-dependency below, in its own tests.
slang-runtime = []
# INTERNAL: enabled by `cargo-gust` only, so that `cargo install cargo-gust` works with no `GUST_PROFILE` (D108).
# With it on and `GUST_PROFILE` unset, the build script of `gust` treats a release build as `dev` instead of refusing
# `slang-runtime`, and prints a `cargo:warning` saying so; an explicit strict `GUST_PROFILE` still refuses. It is not
# part of the pre-1.0 promise (D111): do not name it in an application's manifest.
cargo-gust-bridge = []
# The SPIR-V route (m9.rt2, D172, D174): the macro emits the route's guards (see `gust-compute-macros/spirv-route`). Off by
# default. Turned on by `gust-compute-wgpu/spirv-route`; it changes the emitted Slang text only, nothing in this crate.
spirv-route = ["gust-macros/spirv-route"]

[dependencies]
gust-macros.workspace = true

# Cargo unifies the features of a package with those of its dev-dependency on itself, so every `cargo test -p gust-compute`
# builds the unit and integration tests with the bridge; without this line they do not compile.
[dev-dependencies]
gust = { package = "gust-compute", path = ".", features = ["slang-runtime"] }

[lints]
workspace = true
