[package]
name = "batch-basics"
description = "gpu_batch!: a sealed three-stage batch (1-D, 2-D, in place) with one frame in flight, two tickets and one queue submission per frame"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# `cargo run -p batch-basics` (check-artifacts, check-examples) runs the example; `--bin sb1` runs the SB1 harness.
default-run = "batch-basics"

[dependencies]
gust.workspace = true
gust-wgpu = { workspace = true, features = ["slang-runtime"] }

[dev-dependencies]
# The library ops of a batch (`gust::sum`, `gust::compact`, ..) are gust-algo's: tests/reduce.rs.
gust-algo = { path = "../../crates/gust-algo", features = ["slang-runtime"] }

[lints]
workspace = true
