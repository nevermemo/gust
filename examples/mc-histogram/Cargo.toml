[package]
name = "mc-histogram"
description = "A sampled histogram (integer atomics) smoothed by diffusion, checked against host references"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gust.workspace = true
gust-wgpu = { workspace = true, features = ["slang-runtime"] }
# The sum of the histogram, `reduce::sum_wrapping`. A path dependency, because the library is not a workspace
# dependency; the run-time compile feature is the one `gust-wgpu` already has here.
gust-algo = { path = "../../crates/gust-algo", features = ["slang-runtime"] }

[lints]
workspace = true
