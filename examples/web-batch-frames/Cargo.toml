[package]
name = "web-batch-frames"
description = "A gpu_batch! with two frames in flight in a browser: wasm32 plus WebGPU, run by `cargo xtask check-web`"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# A browser module like `web-vector-add`, with one difference: the batch builder is compiled on the host too, because
# `cargo gust build -p web-batch-frames` collects the kernels of its `gpu_task!` stages from a native expansion and
# writes `gust-artifacts/`, which the strict `web` profile embeds (a browser build never runs Slang). Only the page's
# own code is `cfg(target_arch = "wasm32")`, and the target-scoped dependencies below keep the browser glue out of a
# host build. `cargo xtask check-web` builds it under `GUST_PROFILE=web`.
[lib]
crate-type = ["cdylib"]

[dependencies]
gust.workspace = true
gust-wgpu.workspace = true

# `wasm-bindgen` is pinned to the version of the `wasm-bindgen` CLI that `check-web` requires (it compares the CLI with
# Cargo.lock).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
wgpu.workspace = true

[lints]
workspace = true
