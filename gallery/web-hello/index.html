<!doctype html>
<meta charset="utf-8">
<title>GUST web-hello</title>
<pre id="out">pending</pre>
<script type="module">
  // The Rust side logs one line that starts with GUST_OK or GUST_FAIL to the console, and `cargo xtask check-gallery`
  // reads it from Chrome. This page only covers what Rust cannot: a module that fails to load or a trap that escapes.
  import init, { run } from "./web_hello.js";
  const out = document.getElementById("out");
  try {
    await init();
    out.textContent = await run();
  } catch (error) {
    const line = "GUST_FAIL " + String(error).replace(/\s+/g, " ");
    console.log(line);
    out.textContent = line;
  }
</script>
