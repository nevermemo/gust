[package]
name = "routed"
version = "0.0.0"
edition = "2024"
publish = false

# A routed kernel crate (m8.r1, D65 to D67): the tag `physics` is declared here and used by the module of `src/lib.rs`.
# Plain `cargo` builds the GPU form (no `default`); check-cpu-target E-j routes the tag to the CPU with the variable
# `GUST_ROUTE__routed__physics=cpu`, which `cargo gust` sets from an app's `gust.toml` (m8.r2).
[package.metadata.gust.routes]
physics = { targets = ["gpu", "cpu"] }

# `default-features = false` and no `features`: no run-time Slang bridge, as in `kernels`.
[dependencies]
gust = { package = "gust-compute", path = "../../../crates/gust", default-features = false }

# This is a separate workspace, so the root `[workspace.lints]` does not reach it: declare the cfg that
# `--cfg gust_dual` sets, so that a hand-written `cfg(gust_dual)` is not an unexpected cfg here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gust_dual)'] }
