[package]
name = "app"
version = "0.0.0"
edition = "2024"
publish = false

# The consumer of the precompiled kernel. `default-features = false` and no `features`: the run-time Slang bridge
# (the `slang-runtime` feature of `gust` and `gust-wgpu`) must stay off. Both crates have no default feature today, so
# the line is a guard that keeps it that way if one is ever added, and `cargo xtask check-precompiled` (E2) requires it.
[dependencies]
kernels = { path = "../kernels" }
gust = { path = "../../../crates/gust", default-features = false }
gust-wgpu = { path = "../../../crates/gust-wgpu", default-features = false }

# This is a separate workspace, so the root `[workspace.lints]` does not reach it: declare the cfg that
# `--cfg gust_dual` sets, so that a hand-written `cfg(gust_dual)` is not an unexpected cfg here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gust_dual)'] }
