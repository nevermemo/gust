# Fixture workspace for the facade-path option (`#[gpu(crate = ..)]` and `par_for!`'s `crate(..);`, audit S6, D48):
# `inner` depends on `gust-compute` and re-exports it (`pub use gust;`); `outer` depends on `inner` and on
# `gust-compute-wgpu` (which the map form and `par_for!` still name literally) but NOT on `gust-compute`, and must
# compile the module form, a `route` module, a map function and `par_for!` through `::inner::gust`. It is a workspace
# root of its own, so the root workspace does not contain it, and it has its own committed `Cargo.lock` (the
# `tests/ui` pattern). `cargo xtask check-ui` runs `cargo check -p outer` on it; running the code is not required.
[workspace]
members = ["inner", "outer"]
resolver = "3"
