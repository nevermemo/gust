[package]
name = "route-kernels"
version = "0.0.0"
edition = "2024"
publish = false

# The routes this crate declares (D65 to D67). The apps' `gust.toml` files choose among them; plain `cargo` builds the
# declared defaults (`physics` and its child on the GPU, `fusion` on the CPU). `render`, `solver` and `solver.pinned` are
# declared and used by no module: the driver sets a variable for every declared tag, and validates entries against them.
[package.metadata.gust.routes]
physics = { targets = ["gpu", "cpu"], default = "gpu" }
"physics.broadphase" = {}
fusion = { default = "cpu" }
render = { targets = ["gpu"] }
solver = {}
"solver.pinned" = { targets = ["gpu"] }

# `default-features = false` and no `features`: no run-time Slang bridge, as in `tests/cpu-target/kernels`.
[dependencies]
gust = { package = "gust-compute", path = "../../../crates/gust", default-features = false }

# This is a separate workspace, so the root `[workspace.lints]` does not reach it: declare the cfg that
# `--cfg gust_dual` sets, so that a hand-written `cfg(gust_dual)` is not an unexpected cfg here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gust_dual)'] }
