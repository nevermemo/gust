# Fixture workspace for `cargo xtask check-ui`. It is a workspace root of its own, so the
# root workspace does not contain it and `cargo test --workspace` never builds it.
[workspace]
members = ["barrier-in-helper", "barrier-in-if", "barrier-in-nested-for", "barrier-in-while", "barrier-kernel-no-cpu-strategy", "barrier-ok", "break-in-barrier-loop", "continue-in-barrier-loop", "gpupod-missing", "gpupod-present", "kernel-cpu-bad-value", "kernel-cpu-duplicate", "kernel-cpu-lockstep", "kernel-missing", "labelled-break-in-barrier-kernel", "layout-outside-element", "layout-outside-field", "literal-let-ok", "literal-let-rejected", "map-bool-for-u32", "map-name-collision", "map-nested", "map-ok", "map-signature", "map-three-wide", "map-u32-for-bool", "par-for-binding", "par-for-body-error", "par-for-form", "par-for-ok", "par-for-reserved-name", "profile-dev-no-artifact", "profile-empty", "profile-native-artifact", "profile-native-bridge", "profile-native-no-artifact", "profile-native-no-manifest", "profile-unknown", "question-mark-in-barrier-kernel", "reserved-gust-prefix", "return-in-barrier-kernel", "typed-call-buffer-for-uniform", "typed-call-cpu-target", "typed-call-extent-for-count", "typed-call-kind-mismatch", "typed-call-mismatch", "typed-call-no-cpu-twin", "typed-call-no-run", "typed-call-ok", "workgroup-over-16kib", "wrapping-div-rejected", "wrapping-ok"]
