[package]
name = "hello-gust"
version = "0.1.0"
edition = "2024"

[dependencies]
gust-compute = "0.2.0-dev"
gust-compute-wgpu = "0.2.0-dev"

[features]
# Run-time compile through the Slang toolchain, for development only (`cargo run --features gust-dev`).
gust-dev = ["gust-compute-wgpu/slang-runtime"]
